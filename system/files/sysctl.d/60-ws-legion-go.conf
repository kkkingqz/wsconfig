# Legion Go (helpws plan-legion-go, 3.6): the gaming settings of Bazzite
# (system_files/{deck,desktop}/shared/usr/lib/sysctl.d). swappiness and
# page-cluster stay the kernel's: Bazzite tunes them for zram, here zswap
# is measured first.

# Split-lock detection slows down games that hit it (kernel 6.2+).
kernel.split_lock_mitigate = 0
# Lockup watchdogs off: no NMI every few seconds on a handheld.
kernel.nmi_watchdog = 0
kernel.soft_watchdog = 0
kernel.watchdog = 0

# Memory maps of games under Proton (as SteamOS).
vm.max_map_count = 2147483642
# Fewer reclaim stalls, earlier background reclaim.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Write back early and in small steps: no long stalls on the NVMe/microSD.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# Steam, IDEs and file managers watch many files.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# Path MTU discovery behind broken routers (BBR is the XanMod default).
net.ipv4.tcp_mtu_probing = 1
