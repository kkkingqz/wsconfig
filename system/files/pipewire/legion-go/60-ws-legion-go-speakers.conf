# Speakers of the Legion Go (83E1): Bazzite's convolver on both channels
# (hardware-profiles/lenovo-83e1/pipewire.conf.d/filter-chain.conf; helpws
# plan-legion-go, 3.5). The virtual sink "Legion GO" takes the default; it
# plays into the analog output at PCI c2:00.6. Its own volume
# stays 100%: the impulse is made for that. Check the node name with
# pw-cli ls Node (ws collect, hardware/) if there is no sound.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Legion GO"
            media.name       = "Legion GO"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        label = convolver
                        name  = convFL
                        config = {
                            filename = "/usr/local/share/ws/legion-go/multiwayCor48.wav"
                            channel  = 0
                        }
                    }
                    {
                        type  = builtin
                        label = convolver
                        name  = convFR
                        config = {
                            filename = "/usr/local/share/ws/legion-go/multiwayCor48.wav"
                            channel  = 1
                        }
                    }
                ]
                inputs = [ "convFL:In" "convFR:In" ]
                outputs = [ "convFL:Out" "convFR:Out" ]
            }
            capture.props = {
                node.name      = "Legion GO"
                media.class    = "Audio/Sink"
                priority.driver = 1000
                priority.session = 1000
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "Legion GO corrected"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                node.target = "alsa_output.pci-0000_c2_00.6.analog-stereo"
            }
        }
    }
]
