# ALSA nodes of the Legion Go (83E1), from Bazzite's
# hardware-profiles/lenovo-83e1/wireplumber.conf.d (helpws plan-legion-go,
# 3.5): HDMI over the speakers when connected, the internal microphone first,
# a larger buffer and no suspend for the speakers (no pop, no crackle),
# the same for the AMD ACP microphone.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c2_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        priority.driver        = 900
        priority.session       = 900
        api.alsa.period-size   = 256
        api.alsa.headroom      = 1024
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c2_00.1.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        priority.driver  = 1100
        priority.session = 1100
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.pci-0000_c2_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "ALC257 Analog Internal Microphone"
        priority.driver  = 2100
        priority.session = 2100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        alsa.card_name = "acp6x"
      }
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "acp6x"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        api.alsa.headroom = 1024
      }
    }
  }
]
