name: check

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    # The suite takes well under a minute; a hung test must not hold the runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install fish and shellcheck
        run: sudo apt-get update && sudo apt-get install -y fish shellcheck
      - name: Unit, help and completion tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax of scripts by shebang, sourced *.bash, fish
        run: |
          status=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.bash) bash -n "$f" || status=1; continue ;;
            esac
            # Binary files (the .wav impulse) have no shebang to read.
            [ "$(head -c 2 "$f")" = '#!' ] || continue
            first="$(head -n1 "$f")"
            case "$first" in
              '#!'*python3*) python3 -m py_compile "$f" || status=1 ;;
              '#!'*bash*|'#!'*sh) bash -n "$f" || status=1 ;;
            esac
          done < <(git ls-files -z)
          python3 -m compileall -q lib tests || status=1
          while IFS= read -r -d '' f; do
            fish -n "$f" || status=1
          done < <(git ls-files -z '*.fish')
          exit $status
      - name: shellcheck (warnings; as ws check repo)
        run: |
          files=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            if [[ "$f" == *.bash ]] || head -n1 "$f" | grep -Eq '^#!.*\b(bash|sh)([[:space:]]|$)'; then
              files+=("$f")
            fi
          done < <(git ls-files -z)
          shellcheck --version | head -2
          shellcheck -x -P SCRIPTDIR -S warning "${files[@]}"

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check (builds every home configuration and system tree)
        run: nix flake check --print-build-logs
