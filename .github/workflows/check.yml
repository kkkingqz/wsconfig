name: check

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    # The suite takes about 7 minutes; a hung test must not hold the runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Unit, help and completion tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax of scripts by shebang
        run: |
          status=0
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            first="$(head -n1 "$f")"
            case "$first" in
              '#!'*python3*) python3 -m py_compile "$f" || status=1 ;;
              '#!'*bash*|'#!'*sh) bash -n "$f" || status=1 ;;
            esac
          done < <(git ls-files -z bin system backup bootstrap.sh)
          bash -n backup/btrfs-common.bash || status=1
          bash -n backup/unraid/catalog.bash || status=1
          python3 -m compileall -q lib tests || status=1
          while IFS= read -r -d '' f; do
            fish -n "$f" || status=1
          done < <(git ls-files -z '*.fish')
          exit $status

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check (builds every home configuration and system tree)
        run: nix flake check --print-build-logs
