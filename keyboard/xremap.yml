# =============================================================================
# Workstation macOS-style keyboard layer
# =============================================================================
#
# Semantic modifier model:
#
#   Apple keyboard       PC / Windows keyboard       Linux
#   Command              Win                         Super
#   Option               Alt                         Alt
#   Control              Ctrl                        Ctrl
#
# Do NOT globally swap Ctrl/Super. Ctrl must remain Ctrl for terminals/TUI apps.
#
# GNOME owns system shortcuts. xremap translates application shortcuts and
# converts physical Ctrl+Left/Right into private GNOME workspace chords.
#
# GNOME Wayland application filtering requires the xremap GNOME extension.
# ws-xremap refuses to start without its D-Bus bridge, so terminal exclusions
# can never silently stop working.
#
# xremap reads the store build of this file (keyboard/xremap.nix), where
# @repo@ becomes the checkout path; edits take effect on `ws switch`.
#
# VM consoles (virt-manager, remote-viewer, virt-viewer) get the keys as
# they are: a guest runs this profile itself (helpws virt). Translated here,
# Command+C would reach the guest as Ctrl+C (interrupt in its terminal).
# Every keymap without an application filter excludes them (&vm_consoles),
# except CapsLock: passed through, it would turn on the host CapsLock lock,
# and SPICE copies the host lock keys into the guest. In a VM console it is
# sent as a private chord instead (Shift+Ctrl+Alt+Space, UA: +U), which the
# xremap of the guest turns back into the CapsLock selector.
#
# Remmina is one of them: its RDP sessions go to wsgnomebox (helpws
# plan-wsgnomebox), where keys reach GNOME without /dev/input and no xremap
# runs. GNOME shortcuts there take the keys as typed and the private CapsLock
# chords (keyboard/keyboard.nix, boot = "container").

modmap:
  - name: Apple Fn mode
    device:
      only:
        - ids:0x05ac:0
    remap:
      Fn:
        skip_key_event: false
        press: { set_mode: apple_fn }
        release: { set_mode: default }


keymap:
  - name: macOS tiling on Apple keyboards
    exact_match: true
    mode: apple_fn
    application:
      not: &vm_consoles
        - '/.*[Vv]irt-manager.*/'
        - '/.*[Rr]emote-viewer.*/'
        - '/.*[Vv]irt-viewer.*/'
        - '/.*[Rr]emmina.*/'
    device:
      only:
        - ids:0x05ac:0
    remap:
      Ctrl-Home: Shift-Ctrl-Alt-Super-Left
      Ctrl-End: Shift-Ctrl-Alt-Super-Right
      Ctrl-PageUp: Shift-Ctrl-Alt-Super-Up
      Ctrl-PageDown: Shift-Ctrl-Alt-Super-Down

      Ctrl-F: Shift-Ctrl-Alt-Super-F
      Ctrl-C: Shift-Ctrl-Alt-Super-C
      Ctrl-R: Shift-Ctrl-Alt-Super-R

      # Fn+Option: spatial focus / Tile Editing Mode
      # Fn+Left/Right/Up/Down is normalized to Home/End/PageUp/PageDown.
      Alt-Home:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Left
        - { sleep: 30 }
        - Enter
      Alt-End:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Right
        - { sleep: 30 }
        - Enter
      Alt-PageUp:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Up
        - { sleep: 30 }
        - Enter
      Alt-PageDown:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Down
        - { sleep: 30 }
        - Enter
      Alt-E: Shift-Ctrl-Alt-Super-E
      # Fn+Option+T: toggle Always on Top
      Alt-T: Shift-Ctrl-Alt-Super-T
  # CapsLock into VM consoles as private chords; the guest's selector below
  # takes them. Before the CapsLock rules, which they override there.
  - name: Fn+CapsLock into VM consoles
    exact_match: true
    mode: apple_fn
    device:
      only:
        - ids:0x05ac:0
    application:
      only: *vm_consoles
    remap:
      CapsLock: Shift-Ctrl-Alt-U
      Alt-CapsLock: Shift-Ctrl-Alt-U
  - name: CapsLock into VM consoles
    exact_match: true
    application:
      only: *vm_consoles
    remap:
      CapsLock: Shift-Ctrl-Alt-Space
      Alt-CapsLock: Shift-Ctrl-Alt-U
  # Everywhere, VM consoles too: the host CapsLock lock must never turn on.
  - name: Fn+CapsLock on Apple keyboards
    exact_match: true
    mode: apple_fn
    device:
      only:
        - ids:0x05ac:0
    remap:
      # Fn+CapsLock: select Ukrainian layout
      CapsLock: { launch: ["@core@/libexec/ws-input-source", "ua"] }
      Alt-CapsLock: { launch: ["@core@/libexec/ws-input-source", "ua"] }
  - name: CapsLock input-source selector
    exact_match: true
    remap:
      # Logical CapsLock: OFF=EN, ON=RU. Real CapsLock modifier is suppressed.
      CapsLock: { launch: ["@core@/libexec/ws-input-source", "caps"] }

      # Ukrainian override; does not change remembered EN/RU Caps state.
      Alt-CapsLock: { launch: ["@core@/libexec/ws-input-source", "ua"] }

      # CapsLock and Alt/Fn+CapsLock from a VM console of the host, when
      # this machine is the guest (CapsLock into VM consoles).
      Shift-Ctrl-Alt-Space: { launch: ["@core@/libexec/ws-input-source", "caps"] }
      Shift-Ctrl-Alt-U: { launch: ["@core@/libexec/ws-input-source", "ua"] }
  - name: Input-source cycle
    exact_match: true
    application:
      not: *vm_consoles
    remap:
      # Deterministic input-source cycle
      Ctrl-Space: { launch: ["@core@/libexec/ws-input-source", "next"] }
      Ctrl-Alt-Space: { launch: ["@core@/libexec/ws-input-source", "prev"] }
  - name: macOS Spaces
    exact_match: true
    application:
      not: *vm_consoles
    remap:
      Ctrl-Left: Ctrl-Alt-Super-Left
      Ctrl-Right: Ctrl-Alt-Super-Right

  # Terminal-specific macOS navigation.
  # GNOME normally consumes Super+Left/Right for window tiling. xremap sees
  # the physical event first and converts it before Mutter receives it.
  - name: macOS app/window actions
    exact_match: true
    application:
      not: *vm_consoles
    remap:
      Alt-Super-Esc: { launch: ["@core@/libexec/ws-window", "task-manager"] }
      Super-H: { launch: ["@core@/libexec/ws-window", "hide-current"] }
      Alt-Super-H: { launch: ["@core@/libexec/ws-window", "hide-others"] }
      Alt-Super-W: { launch: ["@core@/libexec/ws-window", "close-current"] }
      Alt-Super-M: { launch: ["@core@/libexec/ws-window", "minimize-current"] }
      Super-Shift-Q: { launch: ["@core@/libexec/ws-window", "logout"] }
      Alt-Super-Shift-Q: { launch: ["@core@/libexec/ws-window", "logout-now"] }

  - name: macOS tiling on PC keyboards
    exact_match: true
    application:
      not: *vm_consoles
    device:
      not:
        - ids:0x05ac:0
    remap:
      Ctrl-Super-Left: Shift-Ctrl-Alt-Super-Left
      Ctrl-Super-Right: Shift-Ctrl-Alt-Super-Right
      Ctrl-Super-Up: Shift-Ctrl-Alt-Super-Up
      Ctrl-Super-Down: Shift-Ctrl-Alt-Super-Down

      # PC equivalent of Fn+Option on Apple: Alt+Win.
      Alt-Super-Left:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Left
        - { sleep: 30 }
        - Enter
      Alt-Super-Right:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Right
        - { sleep: 30 }
        - Enter
      Alt-Super-Up:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Up
        - { sleep: 30 }
        - Enter
      Alt-Super-Down:
        - Shift-Ctrl-Alt-Super-E
        - { sleep: 120 }
        - Down
        - { sleep: 30 }
        - Enter
      Alt-Super-E: Shift-Ctrl-Alt-Super-E
      # Alt+Win+T: toggle Always on Top
      Alt-Super-T: Shift-Ctrl-Alt-Super-T
  - name: Smart Popup on Apple right modifiers
    exact_match: true
    application:
      not: *vm_consoles
    device:
      only:
        - ids:0x05ac:0
    remap:
      # Right Option + Right Command, either press order.
      ALT_R-SUPER_R: Shift-Ctrl-Alt-Super-Space
      SUPER_R-ALT_R: Shift-Ctrl-Alt-Super-Space

  - name: Smart Popup on PC right modifiers
    exact_match: true
    application:
      not: *vm_consoles
    device:
      not:
        - ids:0x05ac:0
    remap:
      # Right Alt + Right Win, either press order.
      ALT_R-SUPER_R: Shift-Ctrl-Alt-Super-Space
      SUPER_R-ALT_R: Shift-Ctrl-Alt-Super-Space

  - name: macOS terminal shortcuts
    exact_match: true
    application:
      only:
        - '/.*[Gg]hostty.*/'
        - '/.*[Ww]ave.*/'
        - '/.*[Tt]erminal.*/'
        - '/.*[Pp]tyxis.*/'
        - '/.*[Kk]itty.*/'
        - '/.*[Aa]lacritty.*/'
    remap:
      Super-Left: Ctrl-A
      Super-Right: Ctrl-E
      Super-Backspace: Ctrl-U
      Alt-Left: Alt-B
      Alt-Right: Alt-F

  - name: macOS Nautilus / Finder shortcuts
    exact_match: true
    application:
      only:
        - '/.*[Nn]autilus.*/'
    remap:
      # Finder view modes
      # Finder Command+1 = Icons; Nautilus Ctrl+2 = Grid
      Super-1: Ctrl-2
      # Finder Command+2 = List; Nautilus Ctrl+1 = List
      Super-2: Ctrl-1

      # Finder Go locations
      Super-Shift-H: Alt-Home
      Super-Shift-C:
        - Ctrl-L
        - { launch: ["@core@/libexec/ws-nautilus-current", "computer"] }
        - { sleep: 300 }
        - Enter
      Super-Shift-O:
        - Ctrl-L
        - { launch: ["@core@/libexec/ws-nautilus-current", "documents"] }
        - { sleep: 300 }
        - Enter
      Super-Shift-D:
        - Ctrl-L
        - { launch: ["@core@/libexec/ws-nautilus-current", "desktop"] }
        - { sleep: 300 }
        - Enter
      Super-Up: Alt-Up
      Super-Down: Enter
      Super-LeftBrace: Back
      Super-RightBrace: Forward

      # Finder file actions
      Super-I: Alt-Enter
      Super-Backspace: Delete
      Super-Delete: Delete
      Super-Shift-N: Ctrl-Shift-N

      # Finder "Go to Folder" / "Connect to Server".
      # Nautilus uses the location entry for both local paths and URIs
      # such as smb:// and sftp://.
      Super-Shift-G: Ctrl-L
      Super-K: { launch: ["nautilus", "x-network-view:///"] }

      # Finder hidden-files toggle
      Super-Shift-Dot: Ctrl-H

  - name: macOS GUI shortcuts
    exact_match: true
    application:
      not:
        - '/.*[Gg]hostty.*/'
        - '/.*[Ww]ave.*/'
        - '/.*[Tt]erminal.*/'
        - '/.*[Pp]tyxis.*/'
        - '/.*[Kk]itty.*/'
        - '/.*[Aa]lacritty.*/'
        # VM consoles (&vm_consoles above)
        - '/.*[Vv]irt-manager.*/'
        - '/.*[Rr]emote-viewer.*/'
        - '/.*[Vv]irt-viewer.*/'
        - '/.*[Rr]emmina.*/'
    remap:
      # Editing
      Super-C: Ctrl-C
      Super-V: Ctrl-V
      Super-X: Ctrl-X
      Super-A: Ctrl-A
      Super-Z: Ctrl-Z
      Super-Shift-Z: Ctrl-Shift-Z

      # Documents / application
      Super-S: Ctrl-S
      Super-O: Ctrl-O
      Super-P: Ctrl-P
      Super-F: Ctrl-F
      Super-N: Ctrl-N
      Super-T: Ctrl-T
      Super-W: Ctrl-W
      Super-Q: Ctrl-Q
      Super-Comma: Ctrl-Comma

      # macOS line/document navigation
      Super-Left: Home
      Super-Right: End
      Super-Up: Ctrl-Home
      Super-Down: Ctrl-End
      Super-Shift-Left: Shift-Home
      Super-Shift-Right: Shift-End
      Super-Shift-Up: Ctrl-Shift-Home
      Super-Shift-Down: Ctrl-Shift-End

      # macOS Option word navigation
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Alt-Shift-Left: Ctrl-Shift-Left
      Alt-Shift-Right: Ctrl-Shift-Right
      Alt-Backspace: Ctrl-Backspace
