# Test VM of phase 6 (ws help history-nix): clean Ubuntu 26.04 on the
# generic kernel in libvirt on mbp16 (ws help virt), GRUB only.

[host]
# `ws host` finds the host by it (the installer's default).
hostname = "generic-pc"
user = "user"
wsconfig = "wsconfig"

[platform]
hardware = "generic-pc"
boot = "grub"
kernelParams = ["quiet", "splash"]
# Display scale of the VM window (lib/scale.nix).
displayScale = 1

[layers]
# No VMs inside the test VM (ws help virt).
vm = false
# Quickshell widgets on the GNOME panel (ws help widgets).
widgets = true
# Neither native Steam nor the Game Mode session in the test VM.
nativeSteam = false
gameMode = false
