# GNOME of the workstation (ws help gnome). ws apply writes these keys with
# dconf on every run: a manual change of them is reverted by the next
# apply, and a key removed here is reset to its default. A host adds or
# replaces keys in nix/hosts/HOST/gnome.toml. ws sync publishes the file.
#
# Values are written explicitly even where they equal the Ubuntu default, so
# a changed distribution default does not reach this machine unnoticed.
#
# Deliberately not here (other owners or user choice): display scale and
# monitors.xml, Mutter experimental-features, input sources and keyboard
# shortcuts (keyboard, with restore), Tiling Assistant bindings, wallpaper;
# gnome/gnome.nix refuses keys of those owners. The power key of mbp16
# (hibernate) is set by gnome.nix: it belongs with logind of the system
# layer.
#
# [settings."DCONF/DIR"]: KEY = value as text, number, true/false or a list
# of texts.
#
# [[extensions]]: the GNOME Shell extensions, in order (uuid, source).
# enabled-extensions is written on every ws apply: an extension enabled or
# disabled by hand (Extension Manager, gnome-extensions) is reset by the
# next apply; add or remove it here instead. New extensions load after a
# log out and in on Wayland. gnome-extensions.nix adds those that depend on
# the host: workstation-hibernate (resume= in kernelParams) and the panel
# adapter of the widgets (layers.widgets). source:
#   ubuntu  gnome-shell-ubuntu-extensions (apt); enabled by the Ubuntu
#           session mode (/usr/share/gnome-shell/modes/ubuntu.json), not
#           written to enabled-extensions
#   ego     extensions.gnome.org. Without pin: ws apply extensions installs
#           the latest version for the running GNOME Shell if it is
#           missing, Extension Manager updates it (ws update extensions
#           asks GNOME Shell for updates the same way). With
#           pin = { version = N, hash = "sha256-..." } (N: the number in the
#           EGO download URL): built by nix/pkgs/gnome-extensions.nix and
#           linked file by file by ws apply; not updated
#   local   gnome/extensions/<uuid> of the core, copied (schemas compiled)
#           by ws apply extensions

# Extensions of the Ubuntu session mode that stay off: the mode enables them
# whatever enabled-extensions says, only disabled-extensions wins. snapd is
# purged (nix/hosts/apt.txt), so its prompt and Snap Store search have
# nothing to talk to.
disabled_extensions = ["snapd-prompting@canonical.com", "snapd-search-provider@canonical.com"]

[settings."org/gnome/desktop/interface"]
color-scheme = "prefer-dark"
accent-color = "orange"
gtk-theme = "Yaru-dark"
icon-theme = "Yaru-dark"
cursor-theme = "Yaru"
font-name = "Ubuntu Sans 11"
document-font-name = "Sans 11"
monospace-font-name = "Ubuntu Sans Mono 11"

# Ubuntu Dock: working baseline captured 2026-09-23.
[settings."org/gnome/shell/extensions/dash-to-dock"]
dock-position = "BOTTOM"
dock-fixed = true
autohide = true
intellihide = true
dash-max-icon-size = 50
show-show-apps-button = true
show-favorites = true
show-running = true
show-trash = false
show-mounts = true
multi-monitor = true
click-action = "focus-minimize-or-appspread"

[[extensions]]
uuid = "ubuntu-dock@ubuntu.com"
source = "ubuntu"

[[extensions]]
uuid = "ubuntu-appindicators@ubuntu.com"
source = "ubuntu"

[[extensions]]
uuid = "ding@rastersoft.com"
source = "ubuntu"

[[extensions]]
uuid = "tiling-assistant@ubuntu.com"
source = "ubuntu"

[[extensions]]
uuid = "web-search-provider@ubuntu.com"
source = "ubuntu"

